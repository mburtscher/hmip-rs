[workspace]
members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Matthias Burtscher"]
license = "MIT"
repository = "https://github.com/mburtscher/HomematicIP.Net"

[workspace.dependencies]
# Plugins in this repository build against the sources; the version is what `cargo publish` uses.
hmip-rs = { path = "crates/hmip-rs", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
tracing = "0.1"

# Plugins ship as a single static binary inside a `scratch` image: optimize for size.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
